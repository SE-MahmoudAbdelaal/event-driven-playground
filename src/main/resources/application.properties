spring.application.name=event-driven-playground

# --------------------------------------------------------------------------------------------
# How events are delivered to the listeners
#
#   true  -> ASYNCHRONOUS: every listener runs on a background thread (@EnableAsync + @Async).
#            publishEvent() returns immediately and the HTTP response does not wait.
#   false -> Spring's DEFAULT behaviour, SYNCHRONOUS: publishEvent() calls the listeners
#            one after another on the request thread and returns when all of them are done.
#
# Switch without editing this file:
#   ./gradlew bootRun --args='--app.events.async=false'
# --------------------------------------------------------------------------------------------
app.events.async=true

# Background threads are named async-1, async-2, ... so they are easy to spot in the logs.
spring.task.execution.thread-name-prefix=async-

# Compact log format:  time  level  [thread]  class : message
# The thread shows WHO runs the code:
#   [http-nio-8080-exec-N] -> the Tomcat thread that handles the HTTP request
#   [async-N]              -> a background thread running an @Async listener
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %-22([%thread]) %-20logger{0} : %msg%n
